[package]
name = "async-ui"
version = "0.1.0"
edition = "2021"
description = "Desktop frontend for Async Agent System"
authors = ["Async Team"]
license = "MIT"

[[bin]]
name = "async-ui"
path = "src/main.rs"

[dependencies]
# UI Framework
iced = { version = "0.12", features = ["advanced", "tokio", "image", "svg"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }

# WebSocket
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
config = "0.13"
dirs = "5.0"

# Async utilities
futures = "0.3"

# URL handling
url = "2.4"

[dev-dependencies]
mockall = "0.11"
tokio-test = "0.4"
wiremock = "0.5"

[profile.release]
# Optimize for size and performance
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
# Fast compilation for development
opt-level = 0
debug = true
